name: Build Play Store 3.7.1 with ReTrace
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/playstore-371-retrace.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor 8
        run: |
          npm install --package-lock=false --no-save --legacy-peer-deps \
            @capacitor/core@8.5.2 \
            @capacitor/android@8.5.2 \
            @capacitor/cli@8.5.2 \
            @capacitor/app@8.1.1

      - name: Prepare web bundle
        shell: bash
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html play.html privacy.html site.css teacher.html teacher.css teacher.js \
             exam.html exam.css exam.js legacy-difficulty-audit.js legacy-case-grading-audit.js \
             manifest.webmanifest sw.js styles-v10.css app-v10.js android-navigation.js www/
          cp questions*.js cases*.js fundamentos-oclusion.js fundamentos-casos.js \
             steiner-questions.js steiner-cases.js fisiologia-funcion-questions.js \
             fisiologia-funcion-cases.js crecimiento-desarrollo-questions.js \
             crecimiento-desarrollo-cases.js habitos-parafunciones-*.js www/
          cp -r brand www/

      - name: Configure permanent package
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('capacitor.config.json')
          d=json.loads(p.read_text())
          d['appId']='com.yomismtz.elcaminodental'
          d['appName']='El Camino Dental'
          d['webDir']='www'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2))
          PY

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure release, R8 and debug symbols
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp brand/ic_launcher_custom.xml android/app/src/main/res/drawable/ic_launcher_custom.xml
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest=Path('android/app/src/main/AndroidManifest.xml')
          x=manifest.read_text()
          x=x.replace('android:exported="true"','android:exported="true" android:keepScreenOn="true"',1)
          x=x.replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/ic_launcher_custom"')
          x=x.replace('android:roundIcon="@mipmap/ic_launcher_round"','android:roundIcon="@drawable/ic_launcher_custom"')
          manifest.write_text(x)

          strings=Path('android/app/src/main/res/values/strings.xml')
          x=strings.read_text()
          x=re.sub(r'<string name="app_name">.*?</string>','<string name="app_name">El Camino Dental</string>',x)
          x=re.sub(r'<string name="title_activity_main">.*?</string>','<string name="title_activity_main">El Camino Dental</string>',x)
          strings.write_text(x)

          gradle=Path('android/app/build.gradle')
          g=gradle.read_text()
          g=re.sub(r'versionCode\s+\d+','versionCode 38',g)
          g=re.sub(r'versionName\s+"[^"]+"','versionName "3.7.1"',g)
          g=g.replace('minifyEnabled false','minifyEnabled true')
          if 'minifyEnabled true' not in g:
              g=g.replace('release {','release {\n            minifyEnabled true',1)
          if "ndk {" not in g:
              g=g.replace('defaultConfig {','defaultConfig {\n        ndk { debugSymbolLevel = "FULL" }',1)
          gradle.write_text(g)

          variables=Path('android/variables.gradle')
          if variables.exists():
              v=variables.read_text()
              v=re.sub(r'compileSdkVersion\s*=\s*\d+','compileSdkVersion = 36',v)
              v=re.sub(r'targetSdkVersion\s*=\s*\d+','targetSdkVersion = 36',v)
              variables.write_text(v)
          PY
          grep -nE 'applicationId|versionCode|versionName|minifyEnabled|debugSymbolLevel' android/app/build.gradle

      - name: Build release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-files
          cp android/app/build/outputs/bundle/release/app-release.aab release-files/El-Camino-Dental-3.7.1-unsigned.aab
          cp android/app/build/outputs/mapping/release/mapping.txt release-files/El-Camino-Dental-3.7.1-retrace-mapping.txt
          if [ -f android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip ]; then
            cp android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip release-files/El-Camino-Dental-3.7.1-native-debug-symbols.zip
          fi
          find android/app/build/outputs -type f -maxdepth 5 | sort > release-files/build-outputs.txt
          find android -type f -name '*.so' | sort > release-files/native-libraries.txt
          sha256sum release-files/* > release-files/SHA256SUMS.txt || true

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: ElCaminoDental-3.7.1-ReTrace
          path: release-files/
          if-no-files-found: error
