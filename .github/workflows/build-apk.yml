name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www android
          mkdir -p www
          find . -maxdepth 1 -type f \
            ! -name 'package.json' \
            ! -name 'package-lock.json' \
            ! -name 'capacitor.config.json' \
            -exec cp {} www/ \;
          cp -R brand www/brand

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/El-Camino-Dental-v2.5-growth.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Camino-Dental-v2.5-growth-APK
          path: dist/El-Camino-Dental-v2.5-growth.apk
          if-no-files-found: error
          retention-days: 30
