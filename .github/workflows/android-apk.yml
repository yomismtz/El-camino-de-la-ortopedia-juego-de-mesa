name: Build Android APK v3.7
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'play.html'
      - 'index.html'
      - 'privacy.html'
      - 'teacher.html'
      - 'teacher.css'
      - 'teacher.js'
      - 'exam.html'
      - 'exam.css'
      - 'exam.js'
      - 'legacy-difficulty-audit.js'
      - 'legacy-case-grading-audit.js'
      - 'app-v10.js'
      - 'step8-progress-runtime.js'
      - 'step9-characters-runtime.js'
      - 'step10-profile-runtime.js'
      - 'step11-characters-runtime.js'
      - 'step11-characters.css'
      - 'step12-question-audit.js'
      - 'step13-question-catalog.js'
      - 'endodoncia-questions-2026.js'
      - 'ortodoncia-questions-2026.js'
      - 'anatomia-questions.js'
      - 'anestesia-dental-questions.js'
      - 'step6-board-runtime.js'
      - 'step16-question-integrity.js'
      - 'step17-study-runtime.js'
      - 'step17-study.css'
      - 'step18-progress-unified.js'
      - 'step19-specialty-stats.js'
      - 'step20-clinical-cases.js'
      - 'endodoncia-audit-2026-10-02.md'
      - 'question-catalog-2026-10-02.md'
      - 'question-audit-2026-10-02.md'
      - 'android-navigation.js'
      - 'site.css'
      - 'styles-v10.css'
      - 'android-touch-v85.css'
      - 'ui-polish.css'
      - 'game-premium-v93.css'
      - 'game-board-canvas-v98.js'
      - 'i18n.js'
      - 'learning-tools.js'
      - 'area-classifier.js'
      - 'primer-parcial-questions.js'
      - 'nomenclatura-etimologia-questions.js'
      - 'accessibility.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'brand/**'
      - 'questions*.js'
      - 'fundamentos-oclusion.js'
      - 'fundamentos-casos.js'
      - 'steiner*.js'
      - 'fisiologia-funcion-questions.js'
      - 'fisiologia-funcion-cases.js'
      - 'crecimiento-desarrollo-questions.js'
      - 'crecimiento-desarrollo-cases.js'
      - 'habitos-parafunciones-*.js'
      - 'cases*.js'
      - 'package.json'
      - 'tests/**'
      - 'QA-RELEASE-CANDIDATE-*.md'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate sources
        shell: bash
        run: |
          node --check app-v10.js
          node --check step7-ai-runtime.js
          node --check step8-progress-runtime.js
          node --check step9-characters-runtime.js
          node --check step10-profile-runtime.js
          node --check step11-characters-runtime.js
          node --check step12-question-audit.js
          node --check step13-question-catalog.js
          node --check endodoncia-questions-2026.js
          node --check ortodoncia-questions-2026.js
          node --check step16-question-integrity.js
          node --check step17-study-runtime.js
          node --check step18-progress-unified.js
          node --check step19-specialty-stats.js
          node --check step20-clinical-cases.js
          node --check game-board-canvas-v98.js
          node --check android-navigation.js
          node --check teacher.js
          node --check exam.js
          node --check legacy-difficulty-audit.js
          node --check legacy-case-grading-audit.js
          node --check fundamentos-oclusion.js
          node --check fundamentos-casos.js
          node --check steiner-questions.js
          node --check steiner-cases.js
          node --check fisiologia-funcion-questions.js
          node --check fisiologia-funcion-cases.js
          node --check crecimiento-desarrollo-questions.js
          node --check crecimiento-desarrollo-cases.js
          for f in habitos-parafunciones-*.js; do node --check "$f"; done
          node --check area-classifier.js
          node --check primer-parcial-questions.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('play.html').read_text()
          js=Path('app-v10.js').read_text()
          assert 'id="rulesDialog"' in html, 'Falta el reglamento consultable'
          assert 'Victoria exacta y rebote en la META' in html, 'Falta regla de rebote'
          assert 'moveWithFinishBounce' in js, 'Falta lógica de rebote en meta'
          assert "elcamino:native-pause" in js, 'Falta pausa nativa segura'
          assert "stopQuestionNarration();" in js and "stopTimer();" in js, 'Falta pausa de narración/cronómetro'
          visible='\n'.join(Path(p).read_text() for p in ['README.md','index.html','play.html','i18n.js','exam.html','exam.js','teacher.html'])
          obsolete=['900 preguntas','🧠 900','2 a 6 jugadores','2–6 jugadores','38 casillas','37 casillas','llega o supera','🎯 Juega y aprueba','Juega y aprueba · 200']
          found=[term for term in obsolete if term in visible]
          assert not found, f'Textos obsoletos detectados: {found}'
          print('Android gameplay + documentation integrity checks: OK')
          PY
          test -f brand/logo-el-camino-dental.svg
          test -f brand/icon-el-camino-dental.svg
          test -f brand/ic_launcher_custom.xml

      - name: Run release candidate QA
        run: npm test

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web bundle
        shell: bash
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html play.html privacy.html site.css teacher.html teacher.css teacher.js exam.html exam.css exam.js legacy-difficulty-audit.js legacy-case-grading-audit.js manifest.webmanifest sw.js nomenclatura-etimologia-questions.js primer-parcial-questions.js styles-v10.css ui-polish.css game-premium-v93.css game-board-canvas-v98.js character-art.css android-touch-v85.css i18n.js learning-tools.js area-classifier.js accessibility.js app-v10.js step7-ai-runtime.js step8-progress-runtime.js step9-characters-runtime.js step10-profile-runtime.js step11-characters-runtime.js android-navigation.js www/
          cp step11-characters.css www/
          cp anatomia-questions.js anestesia-dental-questions.js step6-board-runtime.js step16-question-integrity.js step17-study-runtime.js step17-study.css step18-progress-unified.js step19-specialty-stats.js www/
          cp step12-question-audit.js question-audit-2026-10-02.md www/
          cp step20-clinical-cases.js www/
          cp step13-question-catalog.js question-catalog-2026-10-02.md www/
          cp endodoncia-questions-2026.js endodoncia-audit-2026-10-02.md www/
          cp ortodoncia-questions-2026.js www/
          cp questions*.js cases*.js expansion-questions-2026.js expansion-cases-2026.js nomenclatura-etimologia-questions.js fundamentos-oclusion.js fundamentos-casos.js steiner-questions.js steiner-cases.js fisiologia-funcion-questions.js fisiologia-funcion-cases.js crecimiento-desarrollo-questions.js crecimiento-desarrollo-cases.js habitos-parafunciones-*.js www/
          cp -r brand www/

      - name: Create Android project
        run: npx cap add android

      - name: Sync local web assets
        run: npx cap sync android

      - name: Apply El Camino Dental branding
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp brand/ic_launcher_custom.xml android/app/src/main/res/drawable/ic_launcher_custom.xml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:exported="true"','android:exported="true" android:keepScreenOn="true" android:screenOrientation="landscape"',1)
          s=s.replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/ic_launcher_custom"')
          s=s.replace('android:roundIcon="@mipmap/ic_launcher_round"','android:roundIcon="@drawable/ic_launcher_custom"')
          p.write_text(s)
          strings=Path('android/app/src/main/res/values/strings.xml')
          x=strings.read_text()
          import re
          x=re.sub(r'<string name="app_name">.*?</string>','<string name="app_name">El Camino Dental</string>',x)
          x=re.sub(r'<string name="title_activity_main">.*?</string>','<string name="title_activity_main">El Camino Dental</string>',x)
          strings.write_text(x)
          gradle=Path('android/app/build.gradle')
          g=gradle.read_text()
          import re
          g=re.sub(r'versionCode\s+\d+','versionCode 37',g)
          g=re.sub(r'versionName\s+"[^"]+"','versionName "3.7"',g)
          gradle.write_text(g)
          PY

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            ./gradlew assembleDebug && break
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep $((attempt * 30))
          done

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ElCaminoDental-v3.7.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElCaminoDental-v3.7
          path: ElCaminoDental-v3.7.apk
          if-no-files-found: error
