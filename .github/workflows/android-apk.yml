name: Build Android APK v1.3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'play.html'
      - 'index.html'
      - 'privacy.html'
      - 'teacher.html'
      - 'teacher.css'
      - 'teacher.js'
      - 'app-v10.js'
      - 'styles-v10.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'questions*.js'
      - 'cases*.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate JavaScript
        run: node --check app-v10.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web bundle
        shell: bash
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html play.html privacy.html teacher.html teacher.css teacher.js manifest.webmanifest sw.js styles-v10.css app-v10.js www/
          cp questions*.js cases*.js www/

      - name: Create Android project
        run: npx cap add android

      - name: Force landscape orientation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:exported="true"','android:exported="true" android:screenOrientation="landscape" android:keepScreenOn="true"',1)
          p.write_text(s)
          PY

      - name: Sync local web assets
        run: npx cap sync android

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ElCaminoOrtopediaDental-v1.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElCaminoOrtopediaDental-v1.3
          path: ElCaminoOrtopediaDental-v1.3.apk
          if-no-files-found: error
