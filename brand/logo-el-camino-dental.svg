<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">El Camino Dental</title>
<desc id="desc">Un diente blanco rodeado por una carretera azul en bucle con un amanecer.</desc>
<defs>
  <linearGradient id="tooth" x1=".15" y1=".05" x2=".78" y2="1">
    <stop stop-color="#ffffff"/>
    <stop offset=".62" stop-color="#f7fcff"/>
    <stop offset="1" stop-color="#cceeff"/>
  </linearGradient>
  <linearGradient id="road" x1=".05" y1=".3" x2=".95" y2=".72">
    <stop stop-color="#073f86"/>
    <stop offset=".45" stop-color="#075da8"/>
    <stop offset="1" stop-color="#087fc0"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#0fc1d4"/>
    <stop offset="1" stop-color="#26d4c1"/>
  </linearGradient>
  <linearGradient id="sun" x1=".2" y1="0" x2=".8" y2="1">
